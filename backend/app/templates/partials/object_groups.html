{% if groups %}
  {% for group in groups %}
  {% include "partials/object_group.html" %}
  {% endfor %}
{% else %}
  {% if recorders %}
  <p class="empty-state">Ничего не найдено по запросу</p>
  {% else %}
  <div class="empty-state">
    <h2>Нет устройств</h2>
    <p>Добавьте устройства в разделе <a href="/device-base">База устройств</a> или вручную.</p>
    <button
      type="button"
      class="btn btn-primary"
      style="margin-top:16px;"
      hx-get="/recorders/new"
      hx-target="#drawer-root"
      hx-swap="innerHTML"
    >+ Добавить ТСВ</button>
  </div>
  {% endif %}
{% endif %}
