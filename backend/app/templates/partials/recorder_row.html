<div
  id="recorder-row-{{ recorder.id }}"
  class="recorder-row"
  data-recorder-row
  data-search-text="{{ recorder.object_name }} {{ recorder.host }} {{ recorder.name or '' }}"
>
  <div class="recorder-row-info">
    <div class="recorder-row-name">{{ display_recorder_name(recorder) }}</div>
    <div class="recorder-row-host">{{ format_host_port(recorder.host, recorder.port, recorder.use_https) }}</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    {% include "partials/status_badge.html" %}
    <span class="recorder-row-host" style="font-size:12px;">{{ format_time(recorder.last_check_at) }}</span>
    <button
      type="button"
      class="btn btn-outline"
      {% if not recorder.enabled %}disabled{% endif %}
      hx-post="/recorders/{{ recorder.id }}/check"
      hx-target="#recorder-row-{{ recorder.id }}"
      hx-swap="outerHTML"
      hx-indicator="#check-spinner-{{ recorder.id }}"
    >
      <span id="check-spinner-{{ recorder.id }}" class="htmx-indicator spinner"></span>
      Проверить
    </button>
    <div class="menu-dropdown">
      <details>
        <summary class="btn btn-ghost" style="min-width:40px;padding:0;" aria-label="Действия">⋯</summary>
        <div class="menu-panel">
          <button
            type="button"
            hx-get="/recorders/{{ recorder.id }}/edit"
            hx-target="#drawer-root"
            hx-swap="innerHTML"
          >✎ Изменить</button>
          <button
            type="button"
            class="danger"
            hx-post="/recorders/{{ recorder.id }}/delete"
            hx-swap="none"
            hx-confirm="Удалить регистратор {{ display_recorder_name(recorder) }} на объекте {{ recorder.object_name }}?"
          >🗑 Удалить</button>
        </div>
      </details>
    </div>
  </div>
</div>
