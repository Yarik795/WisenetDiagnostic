<div class="poll-auto-controls">
  <form class="poll-auto-form">
    <input type="hidden" name="refresh_url" value="{{ refresh_url }}">
    <input type="hidden" name="refresh_target" value="{{ refresh_target }}">
    {% if refresh_select %}<input type="hidden" name="refresh_select" value="{{ refresh_select }}">{% endif %}
    {% if poll_page_inventory %}<input type="hidden" name="inventory" value="true">{% endif %}
    <label class="toggle-switch" title="{{ schedule_hint }}">
      <span class="toggle-switch-text">Автообновление</span>
      <input
        type="checkbox"
        class="toggle-switch-input"
        {% if auto_poll_active %}checked{% endif %}
        aria-label="Автообновление"
        hx-trigger="change"
        hx-post="{% if auto_poll_active %}/monitoring/auto-poll/stop{% else %}/monitoring/auto-poll/resume{% endif %}"
        hx-target="#poll-page-actions"
        hx-swap="outerHTML"
        hx-include="closest form"
      >
      <span class="toggle-switch-slider" aria-hidden="true"></span>
    </label>
  </form>
</div>
