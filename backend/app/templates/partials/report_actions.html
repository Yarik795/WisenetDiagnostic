<div class="btn-group report-actions">
  <a
    href="/summary/export/errors.html"
    class="btn btn-outline"
    download
    title="Скачать HTML-отчёт по неисправностям всех систем"
  >Экспорт отчета</a>
  <button
    type="button"
    class="btn btn-outline btn-icon"
    title="Отправить сводку и HTML-отчёт на почту"
    hx-post="/summary/report/email"
    hx-swap="none"
    hx-disabled-elt="this"
    hx-indicator="#report-email-indicator"
    hx-confirm="Отправить сводку и HTML-отчёт на адреса из config.json?"
    aria-label="Отправить отчёт на почту"
  >
    <span id="report-email-indicator" class="htmx-indicator spinner" aria-hidden="true"></span>
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </svg>
  </button>
</div>
