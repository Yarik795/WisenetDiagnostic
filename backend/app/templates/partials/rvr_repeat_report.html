<div id="rvr-repeat-report-root">
  {% if rvr_filters_text %}
  <p class="text-secondary" style="font-size:0.9rem;margin-bottom:12px;">{{ rvr_filters_text }}</p>
  {% endif %}

  {% if not rvr_pp_count %}
  <div class="empty-state">
    <p>{{ rvr_empty_message }}</p>
  </div>
  {% elif not rvr_has_data %}
  <div class="empty-state">
    <p>{{ rvr_empty_message }}</p>
  </div>
  {% else %}
  {% include "partials/rvr_repeat_matrix.html" %}
  {% endif %}
</div>
