<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Wisenet Диагностика{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfCtof4Ujb8zAi86e3+3+y3zb9lgZanRt6TS0yPHR+AJz8n4LGSf3F96ejyPscG+" crossorigin="anonymous"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite">
    {% if toast %}
    <div class="toast {{ toast.type }}">{{ toast.message }}</div>
    {% endif %}
  </div>
  {% block body %}{% endblock %}
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
