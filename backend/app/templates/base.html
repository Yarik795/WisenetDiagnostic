<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Дашборд руководителя ТСО{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=20260713-2">
  <script src="/static/js/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite">
    {% if toast %}
    <div class="toast {{ toast.type }}">{{ toast.message }}</div>
    {% endif %}
  </div>
  {% block body %}{% endblock %}
  <script src="/static/js/app.js?v=20260713-1"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
